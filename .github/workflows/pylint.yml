name: Public tree and Python quality

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.8", "3.9", "3.10"]
    steps:
    - uses: actions/checkout@v4
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        python -m pip install pylint
    - name: Validate the public tree
      run: python validate.py
    - name: Run release-gate tests
      run: python -m unittest test_validate.py
    - name: Analyze Python quality
      run: python -m pylint validate.py build_book.py test_validate.py
    - name: Build a marked draft PDF
      if: matrix.python-version == '3.10'
      run: python build_book.py --draft
    - name: Upload the draft PDF
      if: matrix.python-version == '3.10'
      uses: actions/upload-artifact@v4
      with:
        name: book-draft-not-a-product
        path: release/*DRAFT.pdf
